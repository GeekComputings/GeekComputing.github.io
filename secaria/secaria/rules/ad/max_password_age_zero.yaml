id: AD-PWD-MAXAGE-ZERO
title: Maximum password age set to zero (passwords never expire)
severity: medium
category: active_directory
description: >
  A domain maximum password age of 0 disables expiry for every user,
  letting any compromised credential remain valid indefinitely.
check:
  fact: password_policy.max_age_days
  operator: eq
  value: 0
recommendation: >
  Set a non-zero maximum password age in the default domain policy.
references:
  attack: ["T1110"]
  cis: ["1.1.2"]
  stig: ["V-243474"]
