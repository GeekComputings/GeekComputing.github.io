id: AD-PWD-MAXAGE
title: Maximum password age unset or excessive
severity: low
category: active_directory
description: >
  A maximum password age of 0 means passwords never expire domain-wide;
  an excessively long age lets a compromised credential stay valid for a
  long time. Either extreme weakens credential hygiene.
check:
  fact: password_policy.max_age_days
  operator: gt
  value: 365
recommendation: >
  Set a maximum password age aligned to your risk model (many programs use
  365 days when paired with MFA and breached-password screening, shorter
  otherwise). Avoid 0 (never expires).
references:
  attack: ["T1110"]
  cis: ["1.1.2"]
  stig: ["V-243474"]
